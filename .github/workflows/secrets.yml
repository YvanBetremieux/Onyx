# Scan de secrets (gitleaks) sur tout l'historique : chaque push, chaque PR,
# et chaque semaine (nouvelles règles gitleaks sur l'historique existant).
# En complément du secret scanning + push protection de GitHub, activés sur le repo.
name: Secrets

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: scripts/scan-secrets.sh
